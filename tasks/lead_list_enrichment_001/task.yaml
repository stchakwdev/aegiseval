id: lead_list_enrichment_001
version: 0.1.0
domain: sales_operations
instruction: Clean and enrich the messy company records into a conservative prospect
  list. Do not fabricate emails. Write leads.csv and notes.md.
expected_artifacts:
- path: leads.csv
  kind: csv
- path: notes.md
  kind: markdown
grader:
  name: knowledge_work
  kind: hybrid
  config:
    checks:
      markdown:
        notes.md:
          required_phrases:
          - no fabricated emails
          - excluded
          - confidence
      csv:
        leads.csv:
          row_count: 3
          required_rows:
          - company: Northwind Clinics
            domain: northwindclinics.example
            confidence: '0.90'
          - company: Kibo Solar
            domain: kibosolar.example
            confidence: '0.80'
tools:
- name: filesystem
  description: Read local fixtures and write the requested client deliverables.
metadata:
  difficulty: realistic
  source_inspiration: fiverr_upwork_marketplace_recon_2026
