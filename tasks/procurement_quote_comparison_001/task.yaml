id: procurement_quote_comparison_001
version: 0.1.0
domain: procurement
instruction: Normalize three vendor quotes, flag hidden risks, and recommend a vendor.
  Write comparison.csv and recommendation.md.
expected_artifacts:
- path: comparison.csv
  kind: csv
- path: recommendation.md
  kind: markdown
grader:
  name: knowledge_work
  kind: hybrid
  config:
    checks:
      markdown:
        recommendation.md:
          required_phrases:
          - Vendor B
          - normalized annual cost
          - disqualifying auto-renewal
          - service level
      csv:
        comparison.csv:
          row_count: 3
          required_rows:
          - vendor: Vendor B
            normalized_annual_cost: '14400'
            recommended: 'yes'
tools:
- name: filesystem
  description: Read local fixtures and write the requested client deliverables.
metadata:
  difficulty: realistic
  source_inspiration: fiverr_upwork_marketplace_recon_2026
