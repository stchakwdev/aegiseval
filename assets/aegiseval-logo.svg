  <path d="M256 104 363 144v82c0 72-39 130-107 166-68-36-107-94-107-166v-82l107-40Z" fill="url(#innerGradient)" stroke="#1F2937" stroke-width="3"/>
  <path d="M177 245h54l30-68 35 130 25-62h49" fill="none" stroke="#F8FAFC" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="245" r="14" fill="#06B6D4"/>
  <circle cx="261" cy="177" r="14" fill="#8B5CF6"/>
  <circle cx="296" cy="307" r="14" fill="#EC4899"/>
  <circle cx="370" cy="245" r="14" fill="#22C55E"/>
  <path d="m226 354 24 24 49-58" fill="none" stroke="#22C55E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
