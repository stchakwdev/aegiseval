[project]
name = "aegiseval"
version = "0.1.0"
description = "Reliable infrastructure for agentic knowledge-work evals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
aegis = "aegiseval.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegiseval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
